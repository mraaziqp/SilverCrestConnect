<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Silver Crest Connect '26 — Building Business. Strengthening Community.</title>
    <meta
      name="description"
      content="An exclusive half-day business-to-business networking showcase for 40–50 vetted SME founders, 23 October 2026 in Cape Town. A portion of proceeds funds the Silver Crest Year-End Community Outreach Drive."
    />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="canonical" href="https://scconnect.co.za/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Silver Crest Connect" />
    <meta property="og:url" content="https://scconnect.co.za/" />
    <meta property="og:title" content="Silver Crest Connect '26" />
    <meta
      property="og:description"
      content="Building Business. Strengthening Community. 23 October 2026, Cape Town. A portion of proceeds funds the Year-End Community Outreach Drive."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Cinzel carries the poster's engraved wordmark; Inter handles everything else. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/logo-gold.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- The manifest is set from the route in src/lib/pwa.ts, so that
         installing from /admin gives the dashboard app rather than this one.
         Linked here too, so a crawler or a browser that never runs the script
         still finds the public one. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Kept alongside the standard name above: older iOS still reads it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SC Connect" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; color: #a1a1aa; font-family: sans-serif; text-align: center">
        Silver Crest Connect '26 — 23 October 2026, Cape Town. Please enable JavaScript to apply for
        a seat or donate, or email connect@scconsults.co.za.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
